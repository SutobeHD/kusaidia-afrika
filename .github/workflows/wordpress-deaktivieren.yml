name: Verzeichnis pruefen

# Reine Lesediagnose. Ändert nichts auf dem Server.
#
# Jeder Schritt prüft mit grep, ob ein bestimmter Name im Verzeichnis steht.
# grep liefert – anders als lftp – einen verlässlichen Rückgabewert, das
# Ergebnis ist dadurch am Schritt-Status ablesbar, ohne die Protokolle zu öffnen.

on:
  push:
    paths:
      - '.github/workflows/wordpress-deaktivieren.yml'
  workflow_dispatch:

jobs:
  pruefen:
    name: Anmeldeverzeichnis untersuchen
    runs-on: ubuntu-latest

    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verzeichnis einlesen
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
            cls -1a;
          " > /tmp/liste.txt
          wc -l < /tmp/liste.txt

      - name: 'FRAGE 1 – enthält es wp-content (dann sind wir im Web-Wurzelverzeichnis)'
        continue-on-error: true
        run: grep -q 'wp-content' /tmp/liste.txt

      - name: 'FRAGE 2 – enthält es public_html'
        continue-on-error: true
        run: grep -q 'public_html' /tmp/liste.txt

      - name: 'FRAGE 3 – enthält es unsere index.html'
        continue-on-error: true
        run: grep -qx 'index.html' /tmp/liste.txt

      - name: 'FRAGE 4 – enthält es unseren Ordner assets'
        continue-on-error: true
        run: grep -q 'assets' /tmp/liste.txt

      - name: 'FRAGE 5 – enthält es .htaccess'
        continue-on-error: true
        run: grep -q 'htaccess' /tmp/liste.txt

      - name: 'FRAGE 6 – enthält es einen Ordner mit dem Domainnamen'
        continue-on-error: true
        run: grep -q 'kusaidia' /tmp/liste.txt

      - name: 'FRAGE 7 – enthält es www oder htdocs'
        continue-on-error: true
        run: grep -qE 'www|htdocs' /tmp/liste.txt
