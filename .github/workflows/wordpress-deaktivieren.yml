name: Verzeichnis pruefen

# Reine Lesediagnose – ändert nichts auf dem Webspace.
#
# Liest das Verzeichnis, in dem der FTP-Zugang landet, und legt das Ergebnis
# als Datei _verzeichnis.txt ins Repository. Nur so ist das Listing einsehbar,
# ohne die Actions-Protokolle zu öffnen.
#
# Aufgeführt werden ausschließlich Namen von Dateien und Ordnern, keine
# Inhalte. Die Datei wird nach der Auswertung wieder entfernt.

on:
  push:
    paths:
      - '.github/workflows/wordpress-deaktivieren.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    name: Anmeldeverzeichnis auflisten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verzeichnisse auflisten
        run: |
          {
            echo "== Anmeldeverzeichnis =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              cls -1a;
            " 2>&1 || true

            echo
            echo "== Unterverzeichnis public_html =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              cls -1a public_html/;
            " 2>&1 || true

            echo
            echo "== Arbeitsverzeichnis laut Server =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              pwd;
            " 2>&1 || true
          } > _verzeichnis.txt

          # Sicherheitsnetz: nichts weitergeben, was nach Zugangsdaten aussieht
          sed -i -E 's/(password|passwd|pass)[^ ]*/[entfernt]/gi' _verzeichnis.txt
          wc -l < _verzeichnis.txt

      - name: Ergebnis ins Repository legen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _verzeichnis.txt
          git commit -m "Diagnose: Verzeichnislisting des Webspace" || exit 0
          git push
