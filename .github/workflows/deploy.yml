name: Deploy to Contabo

# Bei jedem Push auf main wird die Seite per FTPS zu Contabo geladen.
# Manuell triggerbar über den "Run workflow"-Knopf in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Sync to Contabo Webspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_HOST }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          protocol:  ftps
          port:      21
          # Zielverzeichnis auf dem Webspace.
          #
          # Der Zugang deployAll landet direkt im Web-Verzeichnis: Mit dem Ziel
          # ./public_html/ brach der Upload nach 13 Sekunden ab, weil es dort
          # kein solches Unterverzeichnis gibt. Deshalb ./ – das Anmelde-
          # verzeichnis ist bereits das Ziel.
          server-dir: ./
          local-dir: ./
          # Nur tatsächlich geänderte Dateien hochladen (delta sync).
          state-name: .ftp-deploy-sync-state.json
          # Diese Dinge gehören nicht auf den Webspace:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            _archive_*.html
            _cdx.json
            _content.md
            _extract.py
            *.swp
            .DS_Store
            README.md
            # Interne Unterlagen: DEPLOY.md beschreibt Hoster, cPanel und den
            # Aufbau des Webspace, build-handbuch.py ist ein Hilfsskript. Beide
            # waren bisher unter kusaidia-afrika.de/DEPLOY.md oeffentlich
            # abrufbar. Sie muessen zusaetzlich einmal von Hand vom Server
            # geloescht werden, denn Ausschluss verhindert nur neue Uploads.
            DEPLOY.md
            build-handbuch.py
