name: Verzeichnis pruefen

# Reine Lesediagnose – ändert nichts auf dem Webspace.
# Kein "pwd": lftp beantwortet den Befehl mit der Verbindungs-URL samt Passwort.

on:
  push:
    paths:
      - '.github/workflows/verzeichnis-pruefen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    name: Webspace erkunden
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Erkunden
        run: |
          lauf() {
            echo "== $1 =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              set net:timeout 20;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              $2
            " 2>&1 || echo "(nicht moeglich)"
            echo
          }

          {
            lauf "Wurzel des Zugangs: /"            "cls -1a /;"
            lauf "Unterordner public_html"          "cls -1a public_html/;"
            lauf "/home"                            "cls -1a /home/;"
            lauf "/public_html"                     "cls -1a /public_html/;"
            lauf "Baum, zwei Ebenen tief"           "find -d 2;"
          } > _verzeichnis.txt

          # Sicherheitsnetz gegen Zugangsdaten in der Ausgabe
          sed -i -E '/ftp:\/\//d; /@kusaidia/d; /[Pp]ass/d' _verzeichnis.txt
          # Umfang begrenzen, damit das Repository nicht geflutet wird
          head -c 60000 _verzeichnis.txt > _v.tmp && mv _v.tmp _verzeichnis.txt
          wc -l < _verzeichnis.txt

      - name: Ergebnis ins Repository legen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _verzeichnis.txt
          git commit -m "Diagnose: Verzeichnislisting" || exit 0
          git push
