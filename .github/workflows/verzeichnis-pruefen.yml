name: Verzeichnis pruefen

# Reine Lesediagnose – ändert nichts auf dem Webspace.
#
# Listet ausschließlich Namen von Dateien und Ordnern auf. Der Befehl "pwd"
# wird bewusst NICHT verwendet: lftp beantwortet ihn mit der vollständigen
# Verbindungs-URL einschließlich Passwort.

on:
  push:
    paths:
      - '.github/workflows/verzeichnis-pruefen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    name: Anmeldeverzeichnis auflisten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Auflisten
        run: |
          {
            echo "== Anmeldeverzeichnis =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              cls -1a;
            " 2>&1 || true

            echo
            echo "== eine Ebene hoeher =="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
              cls -1a ../;
            " 2>&1 || true
          } > _verzeichnis.txt

          # Sicherheitsnetz: alles entfernen, was nach einer Verbindungs-URL
          # oder Zugangsdaten aussieht
          sed -i -E '/ftp:\/\//d; /@kusaidia/d' _verzeichnis.txt
          wc -l < _verzeichnis.txt

      - name: Ergebnis ins Repository legen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _verzeichnis.txt
          git commit -m "Diagnose: Verzeichnislisting" || exit 0
          git push
