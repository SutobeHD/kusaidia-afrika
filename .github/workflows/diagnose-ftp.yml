name: Diagnose FTP

# Temporaer. Klaert, warum "Deploy to Contabo" scheitert.
#
# Jede Pruefung ist ein eigener Job, weil Job-Namen und -Ergebnisse ueber die
# oeffentliche GitHub-API lesbar sind, die Logs aber nicht. Es wird zu keinem
# Zeitpunkt ein Wert ausgegeben - nur "gesetzt / nicht gesetzt" bzw. "Anmeldung
# klappt / klappt nicht".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-ftp-host-gesetzt:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ secrets.FTP_HOST }}
        run: test -n "$V"

  secret-ftp-username-gesetzt:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ secrets.FTP_USERNAME }}
        run: test -n "$V"

  secret-ftp-password-gesetzt:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$V"

  ftps-anmeldung-klappt:
    runs-on: ubuntu-latest
    steps:
      - name: Anmelden und Verzeichnis lesen
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -sS --ssl-reqd --ftp-ssl --max-time 60 \
               -u "$U:$P" "ftp://$H/" --list-only > /dev/null 2>&1
