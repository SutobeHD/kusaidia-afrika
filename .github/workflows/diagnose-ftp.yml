name: Diagnose FTP

# Temporaer. Klaert, warum die FTPS-Anmeldung scheitert.
#
# Jede Pruefung ist ein eigener Job. Die Antwort steckt allein darin, ob der Job
# gruen oder rot ist - Job-Namen und -Ergebnisse sind ueber die oeffentliche
# GitHub-API lesbar, die Logs dagegen nur mit Anmeldung. Es wird bewusst nichts
# ausgegeben, gespeichert oder committet: alles, was aus einer Verbindung mit
# den Zugangsdaten stammt, geht nach /dev/null.
#
# Deutung der vier Ergebnisse:
#   c rot                   -> Zugangsdaten stimmen nicht mehr
#   c gruen, b gruen, a rot -> Zertifikat des Servers wird abgelehnt
#   c gruen, b rot          -> Datenverbindung (Passivmodus) scheitert
#   alle gruen              -> Ursache liegt in der Deploy-Aktion selbst

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-ftp.yml']

jobs:

  a-anmeldung-mit-zertifikatspruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Verzeichnis lesen, Zertifikat wird geprueft
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: curl -sS --ssl-reqd --max-time 45 -u "$U:$P" "ftp://$H/" --list-only -o /dev/null 2>/dev/null

  b-anmeldung-ohne-zertifikatspruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Verzeichnis lesen, Zertifikat wird nicht geprueft
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: curl -sS -k --ssl-reqd --max-time 45 -u "$U:$P" "ftp://$H/" --list-only -o /dev/null 2>/dev/null

  c-nur-anmeldung-ohne-datenkanal:
    runs-on: ubuntu-latest
    steps:
      # Ruft eine Datei ab, die es nicht gibt - dafuer ist kein Datenkanal
      # noetig. curl endet mit 78, wenn die Anmeldung geklappt hat und nur die
      # Datei fehlt, und mit 67, wenn die Anmeldung abgelehnt wurde. Der Job ist
      # also genau dann gruen, wenn die Zugangsdaten noch stimmen.
      - name: Anmelden, nichts uebertragen
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          code=0
          curl -sS -k --ssl-reqd --ftp-method nocwd --max-time 45 \
               -u "$U:$P" "ftp://$H/__gibt_es_nicht__" -o /dev/null 2>/dev/null || code=$?
          test "$code" -eq 78

  d-anmeldung-unverschluesselt:
    runs-on: ubuntu-latest
    steps:
      - name: Verzeichnis lesen, ohne TLS
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: curl -sS --max-time 45 -u "$U:$P" "ftp://$H/" --list-only -o /dev/null 2>/dev/null
